[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "H-logsen"
version = "0.4.13"
description = "Local workbench for code, data analysis, training runs and log investigation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
# Single source of truth for dependencies. requirements.txt only installs this project (-e .).
dependencies = [
    # Web application, MySQL investigation and detectors
    "Flask>=3.1,<3.2",
    "tzdata",
    "Flask-SQLAlchemy>=3.1,<3.2",
    "SQLAlchemy>=2.0.36,<2.1",
    "Flask-Migrate>=4.0,<5",
    "PyMySQL[rsa]>=1.1,<1.2",
    "scikit-learn>=1.5,<1.8",
    "psutil>=7,<8",
    "Flask-WTF>=1.2.2,<1.3",
    "WTForms>=3.2,<3.3",
    "Bootstrap-Flask>=2.4,<3",
    "Flask-Moment>=1,<2",
    "Flask-Mail>=0.10,<0.11",
    "requests>=2.32,<3",
    # Desktop workbench: terminals, native window, Parquet and PDF preview
    "pywinpty==2.0.15; sys_platform == 'win32'",
    "pywebview==6.2.1; sys_platform == 'win32' or sys_platform == 'darwin'",
    "pywin32==312; sys_platform == 'win32'",
    "pyarrow==25.0.1",
    "pypdfium2==5.15.2",
    "Pillow>=12.2,<13",
]

[project.urls]
Repository = "https://github.com/HieuHoai2704/H-LogSense"

[project.optional-dependencies]
# Linux uses the distribution's GTK/WebKitGTK bindings through the system Python.
desktop = ["pywebview==6.2.1; sys_platform == 'linux'"]
# Browser and accessibility QA in scripts/qa.
qa = ["playwright==1.64.1"]
# Lint/format (ruff) and the git hook runner; see [tool.ruff] and .pre-commit-config.yaml.
dev = ["ruff==0.17.6", "pre-commit>=4,<5"]
# scripts/ml research baselines (bgl_window_baseline); never needed by the product.
ml = ["xgboost>=3,<4"]
# academic/course lab scripts only; never needed by the product.
course = ["mysql-connector-python>=9,<10", "skyfield>=1.49,<2"]

[project.scripts]
h-logsen = "app.workbench.__main__:main"

[project.gui-scripts]
h-logsen-desktop = "app.workbench.__main__:desktop_main"

[tool.setuptools]
py-modules = ["config"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["templates/**/*.html", "locales/*.json", "static/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["sandbox", "app/static/vendor", ".local"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, comprehensions, simplify (selected).
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",    # long strings/comments the formatter cannot split; the formatter owns line length
    "SIM105",  # contextlib.suppress is not clearer than a two-line try/except here
    "SIM108",  # ternaries are not forced on multi-line branches
    "C408",    # dict(key=value) is the house style for JSON payloads
    "SIM117",  # a lease or patch scope nested around a transaction reads as two boundaries
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "academic", "config"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E", "W"]  # frozen DDL, kept as generated
