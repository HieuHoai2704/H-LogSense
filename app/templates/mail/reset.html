<!doctype html>
<html lang="en">
<body style="font-family: system-ui, sans-serif; background:#f4f4f2; color:#0b0b0c; padding:24px">
  <div style="max-width:520px; margin:auto; background:#fff; border:2px solid #0b0b0c; border-radius:12px; padding:24px">
    <h1 style="margin-top:0">Reset your {{ app_name }} password</h1>
    <p>A password reset was requested for <strong>{{ username }}</strong>. The link works once and expires in {{ minutes }} minutes.</p>
    <p><a href="{{ reset_url }}" style="display:inline-block; background:#0b0b0c; color:#fff; padding:10px 18px; border-radius:999px; text-decoration:none">Choose a new password</a></p>
    <p style="color:#555; font-size:13px">If you did not ask for this, ignore this email; your password stays the same.</p>
  </div>
</body>
</html>
