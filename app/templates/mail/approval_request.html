<!doctype html>
<html lang="en">
<body style="font-family: system-ui, sans-serif; background:#f4f4f2; color:#0b0b0c; padding:24px">
  <div style="max-width:520px; margin:auto; background:#fff; border:2px solid #0b0b0c; border-radius:12px; padding:24px">
    <h1 style="margin-top:0">New account waiting for approval</h1>
    <p><strong>{{ username }}</strong> ({{ email }}) signed up for {{ app_name }} and waits for your approval.</p>
    <p><a href="{{ review_url }}" style="display:inline-block; background:#0b0b0c; color:#fff; padding:10px 18px; border-radius:999px; text-decoration:none">Review sign-up requests</a></p>
  </div>
</body>
</html>
