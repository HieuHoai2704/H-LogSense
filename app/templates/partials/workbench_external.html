<details id="external-preview" class="panel">
  <summary>{{ tr("Analyze data files") }}</summary>
  <form class="source-controls">
    <label>{{ tr("Project file") }} <input name="path" required maxlength="1024" placeholder="data/results.csv"></label>
    <label>{{ tr("Format") }} <select name="format">
      <optgroup label="{{ tr('Data') }}"><option value="csv">CSV</option><option value="jsonl">JSONL</option><option value="parquet">Parquet</option></optgroup>
      <optgroup label="{{ tr('Logs and evaluation') }}"><option value="hdfs">HDFS</option><option value="openstack">OpenStack</option>
        <option value="jsonl-log">{{ tr("JSONL log") }}</option><option value="csv-log">{{ tr("CSV log") }}</option><option value="evaluation">{{ tr("Evaluation CSV") }}</option></optgroup>
    </select></label>
    <label>{{ tr("Evaluation unit") }} <select name="unit"><option value="event">{{ tr("Event") }}</option><option value="hdfs_block">{{ tr("HDFS block") }}</option><option value="openstack_instance">{{ tr("OpenStack VM") }}</option></select></label>
    <button type="submit">{{ tr("Analyze file") }}</button>
  </form>
  <p>{{ tr("Read locally · CSV/JSONL up to 1 MiB · Parquet up to 256 MiB · statistics up to 5,000 rows.") }}</p>
  <p id="external-status" role="status"></p>
  <section id="external-data" hidden>
    <h2>{{ tr("Column details") }}</h2>
    <div class="table-scroll"><table><thead><tr><th scope="col">{{ tr("Column") }}</th><th scope="col">{{ tr("Type") }}</th><th scope="col">{{ tr("Missing") }}</th></tr></thead>
      <tbody id="external-columns"></tbody></table></div>
    <label>{{ tr("Distribution by column") }} <select id="external-column"></select></label>
    <div id="external-distribution"></div>
    <h2>{{ tr("Sample data") }}</h2>
    <div class="table-scroll"><table id="external-sample"></table></div>
  </section>
  <pre id="external-raw" style="overflow: auto; max-height: 400px;" hidden></pre>
</details>
