name: Workbench clean install

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m scripts.release.package_workbench --output dist/ci
      - uses: actions/upload-artifact@v4
        with:
          name: h-logsen-candidate
          path: dist/ci/
          if-no-files-found: error

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      LOGSENSE_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: h-logsen-candidate
          path: dist/ci
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth
          xvfb-run -a /usr/bin/python3 -m scripts.release.qa_portfolio_install dist/ci --desktop --report dist/install.json
      - if: runner.os != 'Linux'
        run: python -m scripts.release.qa_portfolio_install dist/ci --desktop --report dist/install.json
      - run: python -m pip install . playwright==1.64.1
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - run: python -m scripts.qa.qa_workbench_browser
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: dist/install.json
          if-no-files-found: error

  release-assets:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: h-logsen-candidate
          path: dist/ci
      - uses: actions/upload-artifact@v4
        with:
          name: h-logsen-verified-release-assets
          path: dist/ci/
          if-no-files-found: error
