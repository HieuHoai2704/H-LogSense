name: Feature request
description: Propose new behaviour or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stands in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you would like, and alternatives you considered.
    validations:
      required: true
