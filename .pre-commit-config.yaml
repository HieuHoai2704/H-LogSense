# Install once: python -m pip install -e ".[dev]" && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      # Uses the ruff pinned in pyproject.toml (dev extra), so the hook, CI and editors agree.
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
